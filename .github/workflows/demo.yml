name: YASH-DevOps-Serverless/demo
on:
  workflow_dispatch:
jobs:
  Stage-1:
    runs-on: windows-latest
    concurrency:
      group: "${{ github.ref }}"
      cancel-in-progress: false
    if: github.event_type != 'pull_request'
    steps:
    - uses: actions/checkout@v4.1.0
    - uses: "./.github/actions/task2"
